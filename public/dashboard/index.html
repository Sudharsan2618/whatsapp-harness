<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Console</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="appbar">
        <div class="appbar-brand">
          <div class="brand-mark">A</div>
          <div class="brand-name">Agent Console</div>
        </div>
        <div class="appbar-search">
          <div class="searchbox">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5.5" cy="5.5" r="4" /><line x1="8.5" y1="8.5" x2="12" y2="12" /></svg>
            <input type="text" placeholder="Search" />
          </div>
        </div>
        <div class="appbar-actions"><div class="avatar">P</div></div>
      </header>
      <div class="body">
        <aside class="sidebar">
          <nav class="nav" id="nav"></nav>
          <div class="sidebar-foot">Built on Baileys · multi-tenant control plane</div>
        </aside>
        <main class="main">
          <div class="pagehead"><button id="pagehead-back" class="btn btn-secondary btn-sm" style="display:none">← All tenants</button><h1 id="pagehead-title">Dashboard</h1><div class="pagehead-actions" id="pagehead-actions"></div></div>
          <div class="content" id="view"></div>
        </main>
      </div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
